<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Romantic Aesthetic</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#050505;font-family:'Outfit',sans-serif;height:100vh;perspective:1200px}

/* LOADING */
#loading{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:#050505;z-index:999;
  transition:opacity 1.5s ease,filter 1.5s ease,transform 1.5s ease;
  gap:16px;
}
#loading.out{opacity:0;filter:blur(16px);transform:scale(1.06);pointer-events:none}
.loading-text{color:#ff6eb4;letter-spacing:10px;font-weight:100;font-size:13px;text-shadow:0 0 12px #ff6eb4;transition:all .5s}
.load-icon{font-size:30px;color:#ff6eb4;filter:drop-shadow(0 0 8px #ff6eb4);animation:loadIconPulse 1.5s ease-in-out infinite;transition:opacity .4s}
@keyframes loadIconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bar{width:180px;height:1px;background:#1a1a1a;overflow:hidden;transition:opacity .4s}
.bar span{display:block;height:100%;width:0%;background:#ff6eb4;animation:load 4.2s forwards;box-shadow:0 0 8px #ff6eb4}
@keyframes load{to{width:100%}}
.load-dots{display:flex;gap:8px;transition:opacity .4s}
.load-dots span{width:4px;height:4px;border-radius:50%;background:#ff6eb4;animation:dotb 1.2s ease-in-out infinite}
.load-dots span:nth-child(2){animation-delay:.2s}
.load-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotb{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}

/* CLICK START */
.start-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  cursor:pointer;user-select:none;
  opacity:0;visibility:hidden;
  transition:opacity .6s,visibility .6s;
}
.start-btn.show{opacity:1;visibility:visible}
.start-main{
  color:#ff6eb4;font-size:18px;font-weight:200;letter-spacing:12px;
  text-shadow:0 0 14px #ff6eb4;
  transition:transform .2s;
}
.start-btn:hover .start-main{transform:scale(1.06)}
.start-sub{
  color:rgba(255,110,180,.5);font-size:10px;letter-spacing:6px;font-weight:100;
  animation:pulseSub 1.6s ease-in-out infinite;
}
@keyframes pulseSub{0%,100%{opacity:.35}50%{opacity:1}}

/* SCENE */
#scene{position:fixed;inset:0;opacity:0;transition:opacity 1.5s ease;transform-style:preserve-3d}
#scene.visible{opacity:1}
#bg{position:absolute;inset:0;background:#050505}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,5,.78) 100%);pointer-events:none;z-index:5}

/* Rain text */
.text{
  position:absolute;font-weight:100;white-space:nowrap;
  animation:fall3d linear infinite;
  pointer-events:none;z-index:2;
  transition:color 1.5s ease, text-shadow 1.5s ease;
}
@keyframes fall3d{
  from{transform:translateY(-100px) translateZ(var(--tz)) rotateY(var(--ry))}
  to{transform:translateY(115vh) translateZ(var(--tz)) rotateY(var(--ry))}
}

/* Photo rain */
.photo{
  position:absolute;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  animation:fall3d linear infinite;
  z-index:3;
  transition:box-shadow 1.5s ease, border-color 1.5s ease;
}
.photo:hover{transform:scale(1.25)!important}
.photo img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="load-icon"><i class="fa-solid fa-heart"></i></div>
  <div class="loading-text">LOADING MEMORIES</div>
  <div class="bar"><span></span></div>
  <div class="load-dots"><span></span><span></span><span></span></div>
  <div class="start-btn" id="startBtn">
    <div class="start-main">LET START IT</div>
    <div class="start-sub">click to start</div>
  </div>
</div>

<!-- SCENE -->
<div id="scene">
  <div id="bg"></div>
  <div id="vignette"></div>
</div>

<script src="player.js"></script>
<script>
const MESSAGES = [
  "i love you","i miss you","thinking of u","my favorite person",
  "forever","love u more","always with you","you are enough",
  "my safe place","you mean everything","always on my mind",
  "stay with me","only you","my heart is yours"
];
const PHOTOS = [
  "https://picsum.photos/seed/love1/400/400",
  "https://picsum.photos/seed/love2/400/400",
  "https://picsum.photos/seed/love3/400/400",
];

const COLORS = [
  "#ffffff","#ffe4ef","#ffb6d5","#ff6eb4",
  "#ff2d78","#ff1744","#00e5ff","#d500f9",
];
let currentColor = 0;

function applyGlobalColor() {
  const color = COLORS[currentColor];
  const r = parseInt(color.slice(1,3),16)||255;
  const g = parseInt(color.slice(3,5),16)||110;
  const b = parseInt(color.slice(5,7),16)||180;

  document.querySelectorAll('.text').forEach(el => {
    el.style.color = color;
    el.style.textShadow = `0 0 8px ${color}`;
  });
  document.querySelectorAll('.photo').forEach(el => {
    el.style.borderColor = color + '55';
    el.style.boxShadow = `0 0 14px ${color}44`;
  });
  document.getElementById('bg').style.background =
    `radial-gradient(ellipse 70% 60% at 30% 40%,rgba(${r},${g},${b},.1),transparent),` +
    `radial-gradient(ellipse 50% 70% at 70% 60%,rgba(${r},${g},${b},.06),transparent),#050505`;
}

setInterval(() => {
  currentColor = (currentColor + 1) % COLORS.length;
  applyGlobalColor();
}, 3000);

/* ── LOADING ── */
const loading = document.getElementById('loading');
const startBtn = document.getElementById('startBtn');
let ready = false;

setTimeout(() => {
  ready = true;
  document.querySelector('.load-icon').style.opacity = '0';
  document.querySelector('.loading-text').style.opacity = '0';
  document.querySelector('.bar').style.opacity = '0';
  document.querySelector('.load-dots').style.opacity = '0';
  startBtn.classList.add('show');
  loading.style.cursor = 'pointer';
}, 4400);

function startExperience() {
  loading.classList.add('out');
  document.getElementById('scene').classList.add('visible');
  setTimeout(() => loading.remove(), 1600);
  applyGlobalColor();
  createRainText();
  createPhotoRain();
  if (window.unmuteMusic) window.unmuteMusic();
}

startBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!ready) return;
  startExperience();
});

loading.addEventListener('click', () => {
  if (!ready) return;
  startExperience();
});

/* ── RAIN TEXT (60) ── */
function createRainText() {
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'text';
    el.innerText = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
    const depth = Math.random();
    const sz = 9 + depth * 18;
    el.style.cssText = `
      left:${Math.random()*105}vw;
      font-size:${sz}px;
      opacity:${0.1 + depth * 0.5};
      color:#ff6eb4;
      animation-duration:${10+Math.random()*22}s;
      animation-delay:${-Math.random()*30}s;
      --tz:${depth*200-80}px;
      --ry:${(Math.random()-.5)*28}deg;
      filter:none;
    `;
    document.body.appendChild(el);
  }
}

/* ── PHOTO RAIN (8) ── */
function createPhotoRain() {
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('div');
    el.className = 'photo';
    const depth = Math.random();
    const sz = 65 + depth * 65;
    el.style.cssText = `
      width:${sz}px;height:${sz}px;
      left:${Math.random()*100}vw;
      opacity:${0.3+depth*0.5};
      animation-duration:${16+Math.random()*22}s;
      animation-delay:${-Math.random()*25}s;
      --tz:${depth*160-60}px;
      --ry:${(Math.random()-.5)*30}deg;
    `;
    const img = document.createElement('img');
    img.src = PHOTOS[i % PHOTOS.length];
    img.loading = 'lazy';
    el.appendChild(img);
    document.body.appendChild(el);
  }
}

/* ── MOUSE PARALLAX ── */
let tx = 0, ty = 0;
document.addEventListener('mousemove', e => {
  tx = (e.clientX / innerWidth - .5) * 20;
  ty = (e.clientY / innerHeight - .5) * 12;
});
(function loop() {
  const sc = document.getElementById('scene');
  if (sc) sc.style.transform = `rotateY(${tx*.18}deg) rotateX(${-ty*.12}deg) translate(${tx*.4}px,${ty*.25}px)`;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
